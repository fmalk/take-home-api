<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="36" fill="url(#bg)"/>

  <!-- spokes from hub to each domain node -->
  <g stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="120" x2="120" y2="56"/>
    <line x1="120" y1="120" x2="176" y2="90"/>
    <line x1="120" y1="120" x2="176" y2="150"/>
    <line x1="120" y1="120" x2="120" y2="184"/>
    <line x1="120" y1="120" x2="64" y2="150"/>
    <line x1="120" y1="120" x2="64" y2="90"/>
  </g>

  <!-- domain nodes -->
  <!-- travel: plane -->
  <g transform="translate(120,56)">
    <circle r="20" fill="#0ea5e9"/>
    <path d="M-9,2 L-2,2 L4,-8 L8,-8 L4,2 L9,2 L11,-1 L14,-1 L11,4 L14,9 L11,9 L9,6 L4,6 L8,16 L4,16 L-2,6 L-9,6 Z" fill="#fff" transform="scale(0.6) translate(0,0)"/>
  </g>

  <!-- e-commerce: cart -->
  <g transform="translate(176,90)">
    <circle r="20" fill="#f59e0b"/>
    <g stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-8,-8) scale(0.7)">
      <path d="M0 0 H3 L6 14 H18 L21 4 H5"/>
      <circle cx="8" cy="19" r="1.6" fill="#fff"/>
      <circle cx="17" cy="19" r="1.6" fill="#fff"/>
    </g>
  </g>

  <!-- ticketing: ticket -->
  <g transform="translate(176,150)">
    <circle r="20" fill="#a855f7"/>
    <g fill="none" stroke="#fff" stroke-width="2" transform="translate(-9,-6) scale(0.72)">
      <path d="M1 4a3 3 0 000 6v2a2 2 0 002 2h18a2 2 0 002-2v-2a3 3 0 000-6V2a2 2 0 00-2-2H3a2 2 0 00-2 2z" stroke-linejoin="round"/>
      <line x1="15" y1="0" x2="15" y2="16" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- banking: coin/ledger -->
  <g transform="translate(120,184)">
    <circle r="20" fill="#22c55e"/>
    <g stroke="#fff" stroke-width="2" fill="none">
      <circle r="10" cy="0" cx="0"/>
      <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" stroke="none">$</text>
    </g>
  </g>

  <!-- food delivery: box -->
  <g transform="translate(64,150)">
    <circle r="20" fill="#ef4444"/>
    <g stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round" transform="translate(-8,-8) scale(0.72)">
      <path d="M0 5 L11 0 L22 5 L11 10 Z"/>
      <path d="M0 5 V17 L11 22 V10"/>
      <path d="M22 5 V17 L11 22"/>
    </g>
  </g>

  <!-- scheduling: calendar/clock -->
  <g transform="translate(64,90)">
    <circle r="20" fill="#eab308"/>
    <g stroke="#fff" stroke-width="2" fill="none">
      <circle r="10"/>
      <line x1="0" y1="0" x2="0" y2="-6"/>
      <line x1="0" y1="0" x2="4" y2="2"/>
    </g>
  </g>

  <!-- central hub -->
  <circle cx="120" cy="120" r="26" fill="#f8fafc"/>
  <text x="120" y="126" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="15" fill="#0f172a">API</text>
</svg>
